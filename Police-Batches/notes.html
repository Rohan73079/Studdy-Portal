<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studdy Portal - Notes</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js Libraries for client-side rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
    
    <style>
        /* Custom styles for the main PDF modal */
        #pdfModal {
            transition: opacity 0.3s ease-in-out;
        }
        #pdfIframe {
            width: 100%;
            height: 100%;
        }
        /* Custom styles for the Subject Files modal */
        #subjectFilesModal {
            transition: opacity 0.3s ease-in-out;
        }
        /* Custom scrollbar for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        /* Updated scrollbar for dark theme */
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* gray-600 for visibility on dark background */
            border-radius: 4px;
        }
        
        /* New CSS for the Canvas-based thumbnail container */
        .pdf-thumbnail-container {
            width: 64px; /* w-16 */
            height: 80px; /* h-20 */
            flex-shrink: 0;
            border-radius: 0.5rem;
            overflow: hidden;
            /* Toned down shadow */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
            border: 1px solid #374151; /* gray-700 border */
            background-color: #1f2937; /* gray-800 background */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pdf-thumbnail-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Loading state for thumbnails */
        .pdf-thumbnail-container.loading {
            background-color: #374151; /* gray-700 */
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 font-sans min-h-screen">

    <!-- Main Application Structure -->
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold text-indigo-400">📚 Studdy Portal Notes</h1>
            <p class="text-gray-400 mt-1">Access your subjects and organized folders quickly.</p>
        </header>

        <!-- Tab Navigation -->
        <div class="border-b border-gray-700 mb-6">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button id="tabSubjects" onclick="showSection('subjects')"
                    class="tab-button inline-flex items-center px-1 pb-4 text-sm font-medium border-b-2 border-indigo-500 text-indigo-400 transition duration-150">
                    Subject Notes
                </button>
                <button id="tabFolders" onclick="showSection('folders')"
                    class="tab-button inline-flex items-center px-1 pb-4 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:border-gray-600 hover:text-gray-300 transition duration-150">
                    File Explorer
                </button>
            </nav>
        </div>

        <!-- Subjects Section -->
        <section id="subjectsSection" class="section-content transition-opacity duration-300">
            <h2 class="text-2xl font-semibold text-gray-100 mb-4">Quick Access Subjects</h2>
            <div id="subjectButtonsContainer" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Subject buttons will be injected here -->
            </div>
        </section>

        <!-- Folders Section (File Explorer) -->
        <section id="foldersSection" class="section-content transition-opacity duration-300 hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-semibold text-gray-100">File Explorer</h2>
                <button id="backButton" onclick="navigateBack()"
                    class="hidden bg-gray-700 text-gray-300 p-2 rounded-lg text-sm font-medium hover:bg-gray-600 transition duration-150 shadow-sm disabled:opacity-50"
                    disabled>
                    ← Back
                </button>
            </div>
            <div id="folderContentContainer"
                class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 overflow-hidden custom-scrollbar max-h-[60vh]">
                <!-- Folder/File list will be injected here -->
            </div>
        </section>
    </div>

    <!-- --------------------------------- -->
    <!-- MODAL 1: SUBJECT FILES LISTER (New) -->
    <!-- --------------------------------- -->
    <div id="subjectFilesModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-75 flex justify-center items-center z-50 opacity-0 pointer-events-none p-4">
        <div class="relative bg-gray-800 rounded-xl shadow-2xl w-full max-w-5xl h-[85vh] overflow-hidden flex">
            
            <!-- File List Panel (Wider for mobile, 1/3 for desktop) -->
            <div class="w-full lg:w-1/3 flex-shrink-0 border-r border-gray-700 flex flex-col">
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h3 id="subjectModalTitle" class="text-xl font-bold text-indigo-400 truncate">Subject Files</h3>
                    <button onclick="closeSubjectFilesModal()"
                        class="p-2 text-gray-500 rounded-full hover:bg-gray-700 hover:text-gray-200 transition duration-150">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <!-- List Container -->
                <div class="p-4 flex-grow overflow-y-auto custom-scrollbar">
                    <ul id="subjectFilesList" class="divide-y divide-gray-700">
                        <!-- File list items injected here -->
                    </ul>
                </div>
            </div>

            <!-- Preview Panel (2/3 for desktop) -->
            <div class="hidden lg:flex w-2/3 p-4 flex-col bg-gray-900">
                <div class="flex justify-between items-center mb-4">
                    <h4 id="previewTitle" class="text-lg font-semibold text-gray-300">Select a note for preview.</h4>
                    <button id="openFullButton" onclick="" disabled
                        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition duration-150 text-sm shadow-md flex items-center disabled:opacity-50">
                        Open Full Screen
                    </button>
                </div>
                <div id="previewIframeContainer" class="flex-grow min-h-0 bg-gray-700 rounded-lg shadow-inner overflow-hidden border border-gray-600">
                    <iframe id="previewIframe" class="w-full h-full border-0" title="PDF Preview" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>


    <!-- --------------------------------- -->
    <!-- MODAL 2: FULL-SCREEN PDF VIEWER -->
    <!-- --------------------------------- -->
    <div id="pdfModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-75 flex justify-center items-center z-50 opacity-0 pointer-events-none p-4">
        <div class="relative bg-gray-800 rounded-xl shadow-2xl w-full h-full max-w-5xl max-h-5xl overflow-hidden flex flex-col">
            
            <!-- Modal Header/Controls -->
            <div class="flex-shrink-0 flex justify-between items-center p-4 border-b border-gray-700 bg-gray-800 z-10">
                <h3 id="pdfModalTitle" class="text-lg font-semibold text-gray-100 truncate">Viewing PDF...</h3>
                <div class="space-x-2 flex">
                    <button id="fullscreenButton"
                        class="px-4 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition duration-150 text-sm shadow-md flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m7-5h4m0 0v4m0-4l-5 5m0 7v4m0 0h-4m0 0l5-5m-5 5l5-5m-4 5H4m0 0v-4m0 4l5-5"></path></svg>
                        Full Screen
                    </button>
                    <button id="closeModalButton" onclick="closePdfModal()"
                        class="p-2 text-gray-500 rounded-full hover:bg-gray-700 hover:text-gray-200 transition duration-150">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <!-- PDF Iframe -->
            <div id="iframeContainer" class="flex-grow min-h-0">
                <iframe id="pdfIframe" class="border-0" title="PDF Viewer" allowfullscreen></iframe>
            </div>
        </div>
    </div>


    <script type="module">
        // Import PDF.js classes
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';

        // Set the worker source for PDF.js (crucial for performance)
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

        // Use real PDF links when deploying! These are dummy files.
        const studyData = {
            folders: {
                'Maths': {
                    type: 'folder',
                    contents: {
                        'Re-Exam UP POLICE CONSTABLE FINAL E-BOOK  Final': { type: 'pdf', pdfUrl: 'Special Police Prep/5. UP POLICE CONSTABLE FINAL E-BOOK  Final.pdf' },

                        'Quantitative Aptitude Book English': { type: 'pdf', pdfUrl: 'Special Police Prep/Quantitative Aptitude Book  (English Medium).pdf' },
                        '2500+ UpSi By Gagan pratap': { type: 'pdf', pdfUrl: 'Special Police Prep/2.pdf' },
                        'SSC CGL TIER-I 2024 MATHS': { type: 'pdf', pdfUrl: 'Special Police Prep/Smart ebook/SSC CGL TIER-I 2024 MATHS.pdf' },
                        'E-BOOK (51 Days 51 Marathon FINAL PDF (1)': { type: 'pdf', pdfUrl: 'Special Police Prep/Smart ebook/E-BOOK (51 Days 51 Marathon FINAL PDF (1).pdf' },
                        '25 MATHS MOCK TESTS': { type: 'pdf', pdfUrl: 'Special Police Prep/Smart ebook/25 MATHS MOCK TESTS.pdf' },
                        'UP Police SI,ASI,Constable MATH Previous year Chapter_wise': { type: 'pdf', pdfUrl: 'Special Police Prep/Subject wise/YCT_UP_Police_SI,ASI,_Constable_MATH_Previous_year_Chapter_wise.pdf' },
                    }
                },
                'Reasoning': {
                    type: 'folder',
                    contents: {
                        'UP Constable & SI Reasoning 2500+ Full Book': { type: 'pdf', pdfUrl: 'Special Police Prep/3.pdf' },
                        'YCT_UP_Police_SI,ASI,_Constable_REASONING_Previous_year_Chapter': { type: 'pdf', pdfUrl: 'Special Police Prep/Subject wise/YCT_UP_Police_SI,ASI,_Constable_REASONING_Previous_year_Chapter.pdf' },

                      
                    }
                },
                'English': {
                    type: 'folder',
                    contents: {
                        'Grammar Rules': { type: 'pdf', pdfUrl: 'https://raw.githubusercontent.com/mozilla/pdf.js/master/web/compressed.tracemonkey-pldi-09.pdf' },
                        'Vocabulary List 1': { type: 'pdf', pdfUrl: 'https://www.orimi.com/pdf-test.pdf' },
                    }
                },
                'Hindi': {
                    type: 'folder',
                    contents: {
                        'Vyakaran Notes': { type: 'pdf', pdfUrl: 'https://www.orimi.com/pdf-test.pdf' },
                    }
                },
                'Moolvidhi': {
                    type: 'folder',
                    contents: {
                        'Moolvidhi Encounter 51': { type: 'pdf', pdfUrl: 'Special Police Prep/Subject wise/UP_Police_SI_MOOL_VIDHI_Encounter_51_Round_Practice_Book_2025.pdf' },
                        'Moolvidhi Gk': { type: 'pdf', pdfUrl: 'Special Police Prep/Subject wise/YCT_UP_Police_SI,ASI,_Constable_GK,_MOOLVIDHI_Previous_year_Chapter.pdf' },
                    }
                },
                // The dedicated GKGS folder containing sub-subjects
                'GKGS': {
                    type: 'folder',
                    contents: {
                        'Polity': { type: 'pdf', pdfUrl: 'Special Police Prep/gkgs/Polity.pdf' },
                        'Economics': { type: 'pdf', pdfUrl: 'Special Police Prep/gkgs/ECONOMICS.pdf' },
                        'History': { type: 'pdf', pdfUrl: 'Special Police Prep/gkgs/History.pdf' },
                        'Hindi': { type: 'pdf', pdfUrl: 'Special Police Prep/gkgs/Hindi.pdf' },
                        'UPGK': { type: 'pdf', pdfUrl: 'Special Police Prep/gkgs/UPGK.pdf' },
                        'Static GK': { type: 'pdf', pdfUrl: 'Special Police Prep/gkgs/sg.pdf' },
                        'Complete Static GK_Eng': { type: 'pdf', pdfUrl: 'Special Police Prep/Smart ebook/6. Complete Static GK_Eng.pdf' },
                    }
                }
            }
        };

        let currentFolder = studyData.folders;
        let history = []; // Stack to track navigation history

        // --- PDF.js Thumbnail Generation Function ---

        /**
         * Loads a PDF, renders its first page to a canvas, and returns the canvas element.
         * The container is set to a loading state while processing.
         */
        async function createPdfThumbnail(url, container) {
            container.classList.add('loading');
            
            try {
                // 1. Load the PDF Document
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1); // Always get the first page

                // 2. Set the Viewport Scale (0.5 is a good balance for quality/speed)
                const scale = 0.5;
                const viewport = page.getViewport({ scale });

                // 3. Create the Canvas Element
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                // Canvas size should be proportional to the viewport dimensions
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                // Set CSS dimensions to fit the container (64px wide for h-20 w-16)
                // We'll let CSS handle the final sizing for the container
                canvas.style.maxWidth = "100%";
                canvas.style.maxHeight = "100%";
                canvas.style.objectFit = "contain";
                
                // 4. Render the page onto the canvas
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;

                // 5. Replace loading indicator with the canvas
                container.innerHTML = '';
                container.appendChild(canvas);

            } catch (error) {
                console.error('Error rendering PDF thumbnail for:', url, error);
                // Display a fallback/error message if rendering fails
                container.innerHTML = `<div class="p-1 text-xs text-center text-red-400 leading-tight">Load Failed</div>`;
                container.classList.remove('loading');
            } finally {
                container.classList.remove('loading');
            }
        }


        // --- Core Modal Functions: Full-Screen PDF Viewer (Modal 2) ---

        function openPdfModal(pdfUrl, title) {
            const modal = document.getElementById('pdfModal');
            const iframe = document.getElementById('pdfIframe');
            const titleElement = document.getElementById('pdfModalTitle');

            titleElement.textContent = title;
            iframe.src = pdfUrl;
            
            closeSubjectFilesModal(); 

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
        }

        function closePdfModal() {
            const modal = document.getElementById('pdfModal');
            const iframe = document.getElementById('pdfIframe');

            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');

            setTimeout(() => {
                iframe.src = '';
            }, 300);
            
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        document.getElementById('fullscreenButton').addEventListener('click', () => {
            const iframeContainer = document.getElementById('iframeContainer');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                iframeContainer.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable full-screen mode: " + err.message);
                    alertFallback('Could not enter full-screen mode. Your browser may block it outside of a user-initiated event.');
                });
            }
        });

        // --- Core Modal Functions: Subject File Lister (Modal 1) ---

        /**
         * Opens the modal listing all PDFs within a subject folder.
         */
        function openSubjectFilesModal(subjectName, contents) {
            const modal = document.getElementById('subjectFilesModal');
            document.getElementById('subjectModalTitle').textContent = `${subjectName} Notes`;
            const listContainer = document.getElementById('subjectFilesList');
            listContainer.innerHTML = '';
            
            // Clear previous preview state (for the large right-hand preview)
            document.getElementById('previewTitle').textContent = 'Select a note for preview.';
            document.getElementById('previewIframe').src = '';
            document.getElementById('openFullButton').disabled = true;

            const fileNames = Object.keys(contents);

            if (fileNames.length === 0) {
                listContainer.innerHTML = '<li class="p-3 text-center text-gray-400">No PDF files found in this subject.</li>';
            } else {
                fileNames.forEach(fileName => {
                    const file = contents[fileName];
                    if (file.type === 'pdf') {
                        const li = document.createElement('li');
                        // Updated hover background for dark theme
                        li.className = 'flex items-center justify-between py-3 px-2 cursor-pointer rounded-lg hover:bg-indigo-900 transition duration-150 space-x-4';
                        
                        // 1. Create the container for the Canvas thumbnail
                        const thumbnailContainer = document.createElement('div');
                        thumbnailContainer.className = 'pdf-thumbnail-container';
                        thumbnailContainer.innerHTML = `<svg class="w-8 h-8 text-indigo-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM13 9V3.5L18.5 9H13z"/></svg>`;
                        
                        // 2. Start generating the thumbnail asynchronously
                        createPdfThumbnail(file.pdfUrl, thumbnailContainer);

                        li.innerHTML = `
                            <div class="flex items-center space-x-3 truncate">
                                <svg class="w-6 h-6 text-red-500 flex-shrink-0 hidden sm:block" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"></path></svg>
                                <span class="text-base font-medium text-gray-100 truncate">${fileName}</span>
                            </div>
                        `;
                        
                        // Append the thumbnail container
                        li.appendChild(thumbnailContainer);

                        // Set up click handler to show the larger, right-hand preview
                        li.onclick = () => showFilePreview(fileName, file.pdfUrl);
                        listContainer.appendChild(li);
                    }
                });
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
        }

        function closeSubjectFilesModal() {
            const modal = document.getElementById('subjectFilesModal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('previewIframe').src = '';
        }

        function showFilePreview(fileName, pdfUrl) {
            document.getElementById('previewTitle').textContent = `Previewing: ${fileName}`;
            document.getElementById('previewIframe').src = pdfUrl;
            
            const fullScreenBtn = document.getElementById('openFullButton');
            fullScreenBtn.disabled = false;
            fullScreenBtn.onclick = () => openPdfModal(pdfUrl, fileName);
            
            // Highlight the selected list item - updated color scheme for dark mode
            document.querySelectorAll('#subjectFilesList li').forEach(item => item.classList.remove('bg-indigo-700', 'hover:bg-indigo-900'));
            
            Array.from(document.getElementById('subjectFilesList').children).forEach(item => {
                if (item.querySelector('span')?.textContent?.includes(fileName)) {
                    item.classList.add('bg-indigo-700');
                } else {
                    item.classList.add('hover:bg-indigo-900');
                }
            });
        }

        function alertFallback(message) {
            const messageBox = document.createElement('div');
            // Updated color scheme for dark mode feedback
            messageBox.className = "fixed top-4 right-4 bg-red-800 text-white p-4 rounded-lg shadow-xl z-50 transition-opacity duration-300";
            messageBox.textContent = message;
            document.body.appendChild(messageBox);
            setTimeout(() => {
                messageBox.classList.add('opacity-0');
                setTimeout(() => messageBox.remove(), 300);
            }, 5000);
        }


        // --- Tab and UI Rendering Functions (Unchanged) ---

        function showSection(sectionId) {
            const sections = document.querySelectorAll('.section-content');
            sections.forEach(sec => sec.classList.add('hidden'));

            const targetSection = document.getElementById(`${sectionId}Section`);
            targetSection.classList.remove('hidden');

            // Update tab styling
            document.querySelectorAll('.tab-button').forEach(btn => {
                if (btn.id.includes(sectionId)) {
                    btn.classList.add('border-indigo-500', 'text-indigo-400');
                    btn.classList.remove('border-transparent', 'text-gray-400', 'hover:border-gray-600', 'hover:text-gray-300');
                } else {
                    btn.classList.remove('border-indigo-500', 'text-indigo-400');
                    btn.classList.add('border-transparent', 'text-gray-400', 'hover:border-gray-600', 'hover:text-gray-300');
                }
            });
        }

        function renderSubjects() {
            const container = document.getElementById('subjectButtonsContainer');
            container.innerHTML = '';
            
            Object.keys(studyData.folders).forEach(subjectName => {
                const folder = studyData.folders[subjectName];

                // Updated background/border for dark theme
                const button = document.createElement('button');
                button.className = 'flex flex-col items-start p-4 bg-gray-800 rounded-xl shadow-md hover:shadow-lg transition duration-200 border border-gray-700 hover:border-indigo-500';
                
                button.innerHTML = `
                    <div class="relative w-8 h-8 mb-2">
                        <svg class="absolute top-0 left-0 w-6 h-6 text-indigo-600" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM13 9V3.5L18.5 9H13z"/></svg>
                        <svg class="absolute top-1 left-1 w-6 h-6 text-indigo-400" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM13 9V3.5L18.5 9H13z"/></svg>
                    </div>
                    <span class="text-lg font-semibold text-gray-100 text-left">${subjectName}</span>
                    <span class="text-xs text-indigo-400 font-bold mt-1">Files & Previews</span>
                `;
                
                button.onclick = () => openSubjectFilesModal(subjectName, folder.contents);
                container.appendChild(button);
            });
        }

        function renderFolderContent() {
            const container = document.getElementById('folderContentContainer');
            const backButton = document.getElementById('backButton');
            container.innerHTML = '';

            if (history.length === 0) {
                backButton.classList.add('hidden');
                backButton.disabled = true;
            } else {
                backButton.classList.remove('hidden');
                backButton.disabled = false;
            }

            const items = currentFolder;
            const itemNames = Object.keys(items);

            if (itemNames.length === 0) {
                container.innerHTML = '<p class="p-6 text-center text-gray-400">This folder is empty.</p>';
                return;
            }

            const ul = document.createElement('ul');
            // Updated divide color for dark theme
            ul.className = 'divide-y divide-gray-700';

            itemNames.forEach(name => {
                const item = items[name];
                // Updated hover background for dark theme
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-4 cursor-pointer hover:bg-indigo-900 transition duration-150';
                
                const icon = item.type === 'folder' 
                    ? `<svg class="w-6 h-6 text-yellow-500 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"></path></svg>`
                    : `<svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"></path></svg>`;
                
                li.innerHTML = `
                    <div class="flex items-center space-x-3">
                        ${icon}
                        <span class="text-base font-medium text-gray-100">${name}</span>
                    </div>
                    <span class="text-xs text-gray-500 uppercase">${item.type}</span>
                `;

                li.onclick = () => handleItemClick(name, item);
                ul.appendChild(li);
            });

            container.appendChild(ul);
        }

        function handleItemClick(name, item) {
            if (item.type === 'folder') {
                history.push(currentFolder);
                currentFolder = item.contents;
                renderFolderContent();
            } else if (item.type === 'pdf') {
                openPdfModal(item.pdfUrl, name);
            }
        }

        function navigateBack() {
            if (history.length > 0) {
                currentFolder = history.pop();
                renderFolderContent();
            }
        }

        // --- EXPOSE FUNCTIONS GLOBALLY to allow inline HTML event handlers to work ---
        window.closeSubjectFilesModal = closeSubjectFilesModal;
        window.closePdfModal = closePdfModal;
        window.showSection = showSection;
        window.navigateBack = navigateBack;

        // --- Initialization ---

        window.onload = () => {
            renderSubjects();
            renderFolderContent(studyData.folders);
            showSection('subjects'); // Default view
        };
    </script>

</body>
</html>
