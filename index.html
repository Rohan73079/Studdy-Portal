  <style>
   .butterfly {
  position: fixed;
  width: 50px;
  top: 100px;
  left: 0%;
  cursor: pointer;
  transition: transform 2s ease-out, opacity 2s ease-out;
  z-index: 10;
}

.butterfly.hide {
  opacity: 0;             /* hidden */
}

.study {
  position: absolute;
  width: 100px;
  bottom: 10px;
  right: 0px;
  cursor: pointer;
  transition: transform 2s ease-out, opacity 2s ease-out;
}

.book {
  position: fixed;
  width: 200px;
  top: 20px; /* start above viewport */
  left: 0px;  /* initial X position */
  /* optional: make them rotate while falling */
  transform-origin: center;
  animation-fill-mode: forwards; /* stay at last position after falling */
}

/* Keyframes for realistic falling */
@keyframes fall {
  0% {
    top: -200px; /* start above viewport */
    transform: rotate(0deg);
  }
  50% {
    transform: rotate(10deg);
  }
  100% {
    top: calc(100vh - 200px); /* stop above bottom of viewport */
    transform: rotate(-10deg);
  }
}

/* Apply animation to books */
#book1 {
  animation: fall 3s linear forwards; /* 5 seconds falling */
  left: 0px; 
  z-index: 0;
}

#book2 {
  animation: fall 6s linear forwards; /* different speed for variety */
  left: 200px; 
}

html, body {
  height: 100vh;         /* full screen height */
  overflow: auto;      /* don't allow scrollbars */
  margin: 0;
  padding: 0;
}

  <script>
    const butterflies = document.querySelectorAll('.butterfly');
    
    function moveButterflies() {
      butterflies.forEach(butterfly => {
        const maxX = window.innerWidth - butterfly.offsetWidth;
        const maxY = window.innerHeight - butterfly.offsetHeight;
    
        const x = Math.random() * maxX;
        const y = Math.random() * maxY;
    
        butterfly.style.transform = `translate(${x}px, ${y}px)`;
      });
    }
    
    // Move butterflies every 2 seconds and store the interval
    const movementInterval = setInterval(moveButterflies, 2000);
    
    // Initial position
    moveButterflies();
    
    // Hide butterflies after 5 seconds
    setTimeout(() => {
      butterflies.forEach(b => b.classList.add('hide'));
      clearInterval(movementInterval); // stop moving
    }, 5000);

  // book ka girna
  function createFallingBook(src, leftPosition, duration) {
  const book = document.createElement('img');
  book.src = src;
  book.classList.add('book');
  book.style.left = leftPosition + 'px';
  book.style.animation = `fall ${duration}s linear forwards`;
  document.body.appendChild(book);
}
